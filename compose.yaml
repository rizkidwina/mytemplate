name: fastapi-backend-starter

services:
  # ==========================================
  # FASTAPI
  # ==========================================
  api:
    build:
      context: ./app/api
      dockerfile: Dockerfile
      target: production

    environment:
      APP_NAME: ${APP_NAME:-FastAPI Backend Starter}
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TZ: ${TZ:-Asia/Jakarta}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:?AUTH_JWKS_URL is required}
      AUTH_ISSUER: ${AUTH_ISSUER:?AUTH_ISSUER is required}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?AUTH_AUDIENCE is required}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-EdDSA}

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    networks:
      - backend-network

  # ==========================================
  # POSTGRESQL
  # ==========================================
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:-Asia/Jakarta}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend-network

volumes:
  postgres_data:

networks:
  backend-network:
    driver: bridge